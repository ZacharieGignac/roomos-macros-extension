<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src %CSP_SOURCE% https:; style-src %CSP_SOURCE%; script-src %CSP_SOURCE% 'nonce-%NONCE%'; font-src %CSP_SOURCE%" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="%STYLES_URI%" />
  <title>Settings</title>
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1>Codec Settings</h1>
      <p class="subtitle">Configure preferences, schema, and device profiles</p>
    </header>

    <div class="card preferences-card">
      <h2 class="card-title">Preferences</h2>
      <div class="preferences-compact">
        <label class="pref-item" title="Restart macro framework when saving a macro">
          <input id="autoRestart" type="checkbox" />
          <span>Auto-restart on save</span>
        </label>
        <label class="pref-item" title="Restart when activating or deactivating macros">
          <input id="autoRestartOnActivateDeactivate" type="checkbox" />
          <span>Auto-restart on toggle</span>
        </label>
        <label class="pref-item" title="Show confirmation before deleting a macro">
          <input id="confirmMacroDelete" type="checkbox" />
          <span>Confirm deletions</span>
        </label>
        <label class="pref-item" title="Show confirmation before restarting framework">
          <input id="confirmFrameworkRestart" type="checkbox" />
          <span>Confirm framework restart</span>
        </label>
        <label class="pref-item" title="Apply xAPI schema for completions and hovers">
          <input id="applySchema" type="checkbox" />
          <span>Enable IntelliSense</span>
        </label>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">xAPI Schema</h2>
      <div class="schema-status">
        <div class="status-row">
          <div class="status-label">Status</div>
          <div class="status-value" id="schemaLoaded">—</div>
          <div class="status-meta" id="schemaMeta"></div>
          <div class="status-actions">
            <button id="btnRefreshSchema" class="btn-secondary">Refresh</button>
            <button id="btnShowSchemaJson" class="btn-secondary">View JSON</button>
          </div>
        </div>
        <div class="status-row">
          <div class="status-label">Product Filter</div>
          <select id="forcedProduct" class="product-select"></select>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Device Profiles</h2>
        <div class="card-actions">
          <input id="filter" placeholder="Search profiles..." type="text" class="search-input" />
        </div>
      </div>
      
      <div class="add-profile-form">
        <input id="label" placeholder="Profile Name" type="text" class="form-input" />
        <input id="host" placeholder="Host or IP Address" type="text" class="form-input" />
        <input id="username" placeholder="Username" value="admin" type="text" class="form-input" />
        <input id="password" placeholder="Password" type="password" class="form-input" />
        <button id="addBtn" class="btn-primary">Add Profile</button>
      </div>

      <div class="table-container">
        <table>
    <colgroup>
      <col class="col-active" />
      <col class="col-label" />
      <col class="col-host" />
      <col class="col-user" />
      <col class="col-actions" />
    </colgroup>
    <thead>
      <tr>
        <th class="col-active sort muted" data-key="active">Active <span class="arrow"></span></th>
        <th class="col-label sort" data-key="label">Label <span class="arrow"></span></th>
        <th class="col-host sort" data-key="host">Host <span class="arrow"></span></th>
        <th class="col-user sort" data-key="username">Username <span class="arrow"></span></th>
        <th class="col-actions"></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script nonce="%NONCE%" src="%SCRIPT_URI%"></script>
</body>
</html>
